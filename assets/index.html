<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AP 观测</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232b6583'/%3E%3Cpath d='M8 14a11 11 0 0 1 16 0M11 17.5a6.5 6.5 0 0 1 10 0' stroke='%23fff' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='22' r='2.4' fill='%2336c4c6'/%3E%3C/svg%3E">
<style>
/*
 * 设计语言参考 ros-dpi：淡灰紫底 + 白色大圆角卡片 + 左侧图标导航；品牌钢蓝，关键数字青绿。
 * 序列色取 dataviz 参考调色板前三槽（蓝/橙/青），已用 validate_palette.js 在本页卡片底色上校验（两种主题全对通过）。
 * 浅色下青色对比度 2.82:1，所以每张图都带图例和数据表视图。
 */
:root {
  --paper: #eef0f6; --panel: #ffffff; --sunk: #f4f5f9;
  --ink: #1f2933; --muted: #5f6b77; --faint: #8a949e;
  --line: #e5e8f0; --line-strong: #cdd3de; --grid: #edf0f5;
  --brand: #2b6583; --brand-ink: #2b6583; --brand-weak: #e8ebf8; --accent: #129ea2;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --bad: #d03b3b;
  --good-ink: #08800a; --warn-ink: #9a6a00; --bad-ink: #b42f2f;
  --r-sm: 8px; --r: 14px; --side: 208px; --top: 58px;
  --sans: "Barlow", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --cond: "Barlow Semi Condensed", "Barlow", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11161b; --panel: #1a2128; --sunk: #151b21;
    --ink: #e4e9ee; --muted: #a0abb5; --faint: #77838e;
    --line: #29323b; --line-strong: #3a4550; --grid: #232b33;
    --brand-ink: #74b0d1; --brand-weak: #22303c; --accent: #36c4c6;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --good-ink: #3fc65a; --warn-ink: #f2b84b; --bad-ink: #f07171;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11161b; --panel: #1a2128; --sunk: #151b21;
  --ink: #e4e9ee; --muted: #a0abb5; --faint: #77838e;
  --line: #29323b; --line-strong: #3a4550; --grid: #232b33;
  --brand-ink: #74b0d1; --brand-weak: #22303c; --accent: #36c4c6;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --good-ink: #3fc65a; --warn-ink: #f2b84b; --bad-ink: #f07171;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.5 var(--sans); }
button, input, select { font: inherit; color: inherit; }
a { color: var(--brand-ink); text-decoration: none; }
.num { font-family: var(--cond); font-variant-numeric: tabular-nums; }

/* 框架 */
.side { position: fixed; inset: 0 auto 0 0; width: var(--side); background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; z-index: 5; }
.logo { height: var(--top); display: flex; align-items: center; gap: 10px; padding: 0 20px; font: 700 19px/1 var(--cond); letter-spacing: .5px; color: var(--brand-ink); font-style: italic; }
.logo svg { width: 30px; height: 30px; flex: none; }
.nav { padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.nav a { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 10px; color: var(--ink); font-size: 15px; }
.nav a svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; color: var(--muted); }
.nav a:hover { background: var(--sunk); }
.nav a.on { background: var(--brand-weak); color: var(--brand-ink); font-weight: 600; }
.nav a.on svg { color: var(--brand-ink); }
.side-foot { margin-top: auto; padding: 14px 20px; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; display: inline-block; }
.dot.ok { background: var(--good); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }
.top { position: fixed; top: 0; left: var(--side); right: 0; height: var(--top); background: var(--panel); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 16px; padding: 0 24px; z-index: 4; }
.crumb { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumb b { color: var(--ink); font-weight: 600; }
.top .grow { flex: 1; }
.seg { display: inline-flex; gap: 2px; background: var(--sunk); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 4px 12px; border-radius: 8px; cursor: pointer; color: var(--muted); font-size: 13px; }
.seg button.on { background: var(--panel); color: var(--brand-ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.iconbtn { border: 0; background: transparent; width: 34px; height: 34px; border-radius: 8px; cursor: pointer; display: grid; place-items: center; color: var(--muted); }
.iconbtn:hover { background: var(--sunk); color: var(--ink); }
.iconbtn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
main { margin-left: var(--side); padding: calc(var(--top) + 18px) 18px 32px; min-height: 100vh; }
.loading main > * { opacity: .55; transition: opacity .2s; }

/* 卡片与网格 */
.grid { display: grid; gap: 16px; margin-bottom: 16px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g21 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.card { background: var(--panel); border-radius: var(--r); padding: 16px 18px; min-width: 0; }
.card.flat { background: var(--sunk); }
.card-h { display: flex; align-items: baseline; gap: 4px 10px; margin-bottom: 12px; min-height: 24px; flex-wrap: wrap; }
.card-h h3 { margin: 0; font-size: 16px; font-weight: 700; white-space: nowrap; }
.card-h .sub { flex: 1 1 0; min-width: 0; }
.card-h .sub { color: var(--muted); font-size: 12.5px; }
.card-h .act { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.link-btn { border: 0; background: transparent; color: var(--brand-ink); cursor: pointer; font-size: 13px; padding: 2px 4px; }
.link-btn:hover { text-decoration: underline; }
.panel-title { background: var(--panel); border-radius: var(--r); padding: 14px 18px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.panel-title h2 { margin: 0; font-size: 18px; }
.panel-title .sub { color: var(--muted); font-size: 13px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13.5px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; font-weight: 500; }
.big { font: 600 40px/1.1 var(--cond); color: var(--accent); }
.big small { font-size: 20px; color: var(--muted); font-weight: 500; margin-left: 4px; }
.mid { font: 600 26px/1.15 var(--cond); }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.meter { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.sp { justify-content: space-between; }
.stack-bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--sunk); gap: 2px; }
.stack-bar i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.key { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.key.box { height: 10px; width: 10px; border-radius: 3px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.pill.ok { color: var(--good-ink); } .pill.warn { color: var(--warn-ink); } .pill.bad { color: var(--bad-ink); }
.pill .dot { width: 6px; height: 6px; }
.band-tag { font: 600 11.5px/1 var(--cond); padding: 3px 6px; border-radius: 5px; border: 1px solid var(--line-strong); color: var(--muted); }
.empty { color: var(--muted); text-align: center; padding: 26px 0; font-size: 13px; }
.banner { background: var(--panel); border-left: 4px solid var(--bad); border-radius: var(--r-sm); padding: 10px 14px; margin-bottom: 16px; display: flex; gap: 10px; align-items: center; }

/* 健康与事件列表 */
.gauge { position: relative; width: 150px; height: 112px; margin: 0 auto; }
.gauge svg { width: 150px; height: 112px; }
.gauge .v { position: absolute; left: 0; right: 0; top: 46px; text-align: center; font: 600 36px/1 var(--cond); color: var(--accent); }
.gauge .v small { font-size: 15px; color: var(--muted); }
.find { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.find:first-child { border-top: 0; padding-top: 0; }
.find .ic { width: 20px; height: 20px; border-radius: 50%; flex: none; display: grid; place-items: center; font: 700 12px/1 var(--cond); color: #fff; margin-top: 1px; }
.find .ic.warn { background: var(--warn); color: #3a2a00; } .find .ic.bad { background: var(--bad); } .find .ic.info { background: var(--brand); }
.find b { font-weight: 600; } .find p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.ev { display: grid; grid-template-columns: 92px 22px minmax(0, 1fr); gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); align-items: start; font-size: 13.5px; }
.ev:first-child { border-top: 0; }
.ev time { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.ev .ek { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; background: var(--sunk); color: var(--muted); }
.ev .ek svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ev .ek.bad { color: var(--bad-ink); } .ev .ek.warn { color: var(--warn-ink); } .ev .ek.ok { color: var(--good-ink); }
.ev .who { font-weight: 600; }
.day-h { font-size: 12.5px; color: var(--muted); font-weight: 600; padding: 14px 0 4px; border-bottom: 1px solid var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line-strong); background: var(--panel); border-radius: 999px; padding: 3px 11px; font-size: 13px; cursor: pointer; color: var(--muted); }
.chip.on { background: var(--brand-weak); color: var(--brand-ink); border-color: transparent; font-weight: 600; }
.chip .n { font-family: var(--cond); margin-left: 4px; opacity: .8; }
.search { border: 1px solid var(--line-strong); background: var(--panel); border-radius: 10px; padding: 6px 12px; min-width: 200px; }

/* 表格 */
.tbl-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.t th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12.5px; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; cursor: default; user-select: none; }
table.t th.s { cursor: pointer; } table.t th.s:hover { color: var(--ink); }
table.t th .arr { font-size: 10px; margin-left: 3px; }
table.t td { padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
table.t td.r, table.t th.r { text-align: right; }
table.t tbody tr:hover td { background: var(--sunk); }
table.t tr.click { cursor: pointer; }
table.t tr.off td { color: var(--faint); }
.dev b { font-weight: 600; display: block; } .dev span { font-size: 12px; color: var(--muted); font-family: var(--cond); }
.sig { display: inline-flex; align-items: center; gap: 8px; }
.bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; }
.bars i { width: 4px; border-radius: 1px; background: var(--line-strong); display: block; }
.bars.q4 i.f, .bars.q3 i.f { background: var(--good); } .bars.q2 i.f { background: var(--accent); } .bars.q1 i.f { background: var(--warn); } .bars.q0 i.f { background: var(--bad); }
.tbl-data { max-height: 280px; overflow: auto; margin-top: 8px; border-top: 1px solid var(--line); }
.tbl-data table.t td, .tbl-data table.t th { padding: 4px 8px; font-size: 12.5px; }

/* 图表 */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart .ax { fill: var(--faint); font: 11px var(--cond); }
.chart .gl { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.chart .base { stroke: var(--line-strong); stroke-width: 1; shape-rendering: crispEdges; }
.chart .xh { stroke: var(--muted); stroke-width: 1; opacity: .5; }
.tip { position: fixed; pointer-events: none; z-index: 50; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(0,0,0,.14); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; min-width: 140px; display: none; }
.tip .tt { color: var(--muted); margin-bottom: 4px; font-size: 12px; }
.tip .tr { display: flex; align-items: center; gap: 8px; line-height: 1.7; }
.tip .tr b { font-family: var(--cond); font-size: 14px; font-weight: 600; min-width: 54px; }
.tip .tr span { color: var(--muted); }
.hbar { display: grid; grid-template-columns: 150px minmax(0, 1fr) 70px; gap: 8px; align-items: center; font-size: 12.5px; padding: 2px 0; }
.hbar .tr { height: 12px; background: var(--sunk); border-radius: 0 4px 4px 0; }
.hbar .tr i { display: block; height: 100%; border-radius: 0 4px 4px 0; }
.hbar .v { text-align: right; font-family: var(--cond); color: var(--muted); }
.note { color: var(--muted); font-size: 12.5px; margin-top: 8px; }
.btn { border: 1px solid var(--line-strong); background: var(--panel); border-radius: 9px; padding: 6px 14px; cursor: pointer; }
.btn:hover { border-color: var(--brand-ink); color: var(--brand-ink); }
.btn.pri { background: var(--brand); color: #fff; border-color: var(--brand); }
code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; background: var(--sunk); padding: 1px 5px; border-radius: 5px; }

.modal { position: fixed; inset: 0; background: rgba(0,0,0,.38); display: grid; place-items: center; z-index: 60; padding: 16px; }
.modal .box { background: var(--panel); border-radius: var(--r); padding: 20px 22px; width: min(400px, 100%); box-shadow: 0 12px 40px rgba(0,0,0,.25); }
.modal h3 { margin: 0 0 6px; font-size: 17px; }
.field { display: grid; gap: 4px; margin-bottom: 12px; min-width: 0; }
.field label { color: var(--muted); font-size: 12.5px; }
.field .hint { color: var(--faint); font-size: 12px; }
.inp { border: 1px solid var(--line-strong); background: var(--panel); border-radius: 9px; padding: 7px 10px; width: 100%; min-width: 0; }
.inp:focus { outline: 2px solid var(--focus, var(--brand)); outline-offset: -1px; }
.form-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 18px; }
.form-sec { font-weight: 600; margin: 4px 0 10px; color: var(--ink); grid-column: 1 / -1; }
.confirm { background: var(--sunk); border-radius: 10px; padding: 12px 14px; margin-top: 12px; }
.confirm p { margin: 0 0 10px; font-size: 13.5px; }
.btn.danger { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn:disabled { opacity: .55; cursor: default; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
table.t .sm { display: none; margin-top: 4px; }
#dv-b td.dev { white-space: normal; }
.tag { font-size: 11.5px; padding: 1px 6px; border-radius: 5px; background: var(--brand-weak); color: var(--brand-ink); font-weight: 500; }
.msg { font-size: 13px; margin-top: 8px; } .msg.ok { color: var(--good-ink); } .msg.bad { color: var(--bad-ink); }
.sw-card .big { font-size: 30px; }
.list-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.list-row:first-child { border-top: 0; }
.list-row .grow { flex: 1; min-width: 0; }
@media (max-width: 1180px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 860px) {
  :root { --side: 0px; }
  .side { position: fixed; inset: auto 0 0 0; width: auto; height: 60px; flex-direction: row; border-right: 0; border-top: 1px solid var(--line); }
  .logo, .side-foot { display: none; }
  .nav { flex-direction: row; flex: 1; padding: 6px; gap: 2px; justify-content: space-around; }
  .nav a { flex-direction: column; gap: 2px; padding: 6px 4px; font-size: 11px; flex: 1; text-align: center; }
  .top { left: 0; padding: 0 16px; gap: 8px; }
  .top .crumb { display: none; }
  main { padding: calc(var(--top) + 12px) 16px 84px; }
  .g4, .g3, .g2, .g21, .form-grid { grid-template-columns: minmax(0, 1fr); }
  .seg button { padding: 4px 8px; }
  .hbar { grid-template-columns: 110px minmax(0, 1fr) 54px; }
  table.t .hm, .sig svg, .sig .pill { display: none; }
  table.t .sm { display: block; }
  table.t td, table.t th { padding: 8px 6px; }
}
</style>
</head>
<body>
<aside class="side">
  <div class="logo"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#2b6583"/><path d="M8 14a11 11 0 0 1 16 0M11 17.5a6.5 6.5 0 0 1 10 0" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/><circle cx="16" cy="22" r="2.4" fill="#36c4c6"/></svg>APWATCH</div>
  <nav class="nav" id="nav"></nav>
  <div class="side-foot"><span class="dot" id="conn-dot"></span><span id="conn-txt">连接中…</span></div>
</aside>
<header class="top">
  <div class="crumb" id="crumb"></div>
  <div class="grow"></div>
  <div class="seg" id="range"></div>
  <button class="iconbtn" id="theme" title="切换主题" aria-label="切换主题"></button>
</header>
<main id="view"></main>
<div class="tip" id="tip"></div>

<script>
"use strict";
// ---------- 工具 ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem("apw." + k); return v == null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("apw." + k, v); } catch {} },
};
async function api(path) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 50000);
  try {
    const r = await fetch(path, { signal: ctl.signal });
    if (!r.ok) throw new Error((await r.text()) || r.status);
    return await r.json();
  } finally { clearTimeout(timer); }
}
// 改动类请求：带防跨站头；未登录时弹出密码框，登录后重试一次
async function apiPost(path, body) {
  const send = async () => {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-Apw": "1" }, body: JSON.stringify(body || {}) });
    return { r, j: await r.json().catch(() => ({})) };
  };
  let { r, j } = await send();
  if (r.status === 401 && path !== "/api/login") {
    if (!(await loginDialog())) throw new Error("未登录");
    ({ r, j } = await send());
  }
  if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}
async function apiAuthGet(path) {
  const r = await fetch(path);
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { const e = new Error(j.error || "未登录"); e.unauth = true; throw e; }
  if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}
function loginDialog() {
  return new Promise(resolve => {
    const m = document.createElement("div");
    m.className = "modal";
    m.innerHTML = `<form class="box"><h3>登录管理</h3><p class="muted" style="margin:0 0 14px;font-size:13px">输入 AP 管理员密码（和官方管理页面同一个），12 小时内不用再输。</p>

function dataTable(o) {
  const S = o.series, f = o.tipFmt || (v => fmtNum(v, 1) + (o.unit || ""));
  const rows = o.t.map((tv, i) => `<tr><td>${fmtFull(tv)}</td>${S.map(s => `<td class="r num">${esc(s.values[i] == null ? "—" : (s.fmt || f)(s.values[i]))}</td>`).join("")}</tr>`).reverse().join("");
  return `<div class="tbl-data"><table class="t"><thead><tr><th>时间</th>${S.map(s => `<th class="r">${esc(s.name)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;
}
// 一张带标题的图卡片：返回 set(opts) 用于刷新
function chartCard(parent, title, sub) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<div class="card-h"><h3>${esc(title)}</h3><span class="sub">${esc(sub || "")}</span><div class="act"><button class="link-btn tb">数据表</button></div></div><div class="chart"></div><div class="tw"></div>`;
  parent.appendChild(card);
  const el = card.querySelector(".chart"), tw = card.querySelector(".tw");
  let c = null, showT = false, last = null;
  card.querySelector(".tb").onclick = e => { showT = !showT; e.target.textContent = showT ? "收起表" : "数据表"; tw.innerHTML = showT && last ? dataTable(last) : ""; };
  return {
    card,
    set(o) {
      last = o;
      if (c) { c.opts = o; c.draw(); } else c = chart(el, o);
      if (showT) tw.innerHTML = dataTable(o);
    },
    sub(s) { card.querySelector(".sub").textContent = s; },
  };
}
function hbars(items, color, total) {
  const mx = Math.max(1, ...items.map(x => x[1]));
  const sum = total || items.reduce((a, x) => a + x[1], 0) || 1;
  return items.map(([k, v]) => `<div class="hbar"><span>${esc(k)}</span><div class="tr"><i style="width:${(v / mx * 100).toFixed(1)}%;background:var(${color})"></i></div><span class="v">${(v / sum * 100).toFixed(1)}%</span></div>`).join("");
}
function gauge(score) {
  const a0 = Math.PI * 0.8, a1 = Math.PI * 2.2, r = 58, cx = 75, cy = 72;
  const pt = a => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  const arc = (from, to, col, w) => { const [x1, y1] = pt(from), [x2, y2] = pt(to); return `<path d="M${x1},${y1}A${r},${r} 0 ${to - from > Math.PI ? 1 : 0} 1 ${x2},${y2}" stroke="${col}" stroke-width="${w}" fill="none" stroke-linecap="round"/>`; };
  const col = score >= 85 ? "var(--accent)" : score >= 65 ? "var(--warn)" : "var(--bad)";
  return `<div class="gauge"><svg viewBox="0 0 150 112">${arc(a0, a1, "var(--sunk)", 10)}${score > 0 ? arc(a0, a0 + (a1 - a0) * score / 100, col, 10) : ""}</svg><div class="v">${score}<small> 分</small></div></div>`;
}

// 两个序列的时间轴可能不同，合并到同一时间轴
function unionT(...ds) { const s = new Set(); for (const d of ds) for (const t of d.data.t) s.add(t); return [...s].sort((a, b) => a - b); }
function alignSeries(specs) {
  const T = unionT(...specs.map(s => s[0]));
  return specs.map(([d, field, name, color, extra]) => {
    const m = new Map(d.data.t.map((t, i) => [t, d.data.v[field][i]]));
    return { name, color, values: T.map(t => m.has(t) ? m.get(t) : null), ...(extra || {}) };
  });
}
function radioCard(r, i, o) {
  const f = r.iface || {}, m = modeInfo(r.mode);
  const busy = r.busy, tx = r.tx || 0, rx = r.rx || 0, other = Math.max(0, (busy || 0) - tx - rx);
  return `<div class="card"><div class="card-h"><h3>${bandName(i)} 射频</h3><span class="sub">${esc(r.ssid || "")}</span><div class="act"><a class="link-btn" href="#/radio">详情 ›</a></div></div>

        <div class="stack-bar" style="margin:8px 0 6px">${busy != null ? `<i style="width:${tx}%;background:var(--s1)"></i><i style="width:${rx}%;background:var(--s2)"></i><i style="width:${other}%;background:var(--s3)"></i>` : ""}</div>
        <div class="legend" style="margin:0"><span><i class="key box" style="background:var(--s1)"></i>发送 ${fmtNum(tx, 0)}%</span><span><i class="key box" style="background:var(--s2)"></i>接收 ${fmtNum(rx, 0)}%</span><span><i class="key box" style="background:var(--s3)"></i>其他 ${fmtNum(other, 0)}%</span></div>
      </div>
      <dl class="kv">
        <dt>信道</dt><dd class="num">${f.chan ?? "—"}${f.width ? ` · ${f.width}MHz` : ""}</dd>
        <dt>模式</dt><dd>${esc(r.mode ? m.gen : "—")}</dd>
        <dt>终端</dt><dd class="num">${r.clients}</dd>
        <dt>下行 / 上行</dt><dd class="num">${fmtMbps(r.tx_mbps)} / ${fmtMbps(r.rx_mbps)}</dd>
        <dt>底噪</dt><dd class="num">${r.nf ?? "—"} dBm</dd>
        <dt>发射功率</dt><dd class="num">${f.txpower ? f.txpower + " dBm" : "—"}</dd>
      </dl>
    </div></div>`;
}

  let q = "", data = null, logged = false, blocked = new Set();
  root.innerHTML = `<div class="panel-title"><h2>设备</h2><span class="sub" id="dv-sum"></span><div style="flex:1"></div><input class="search" id="dv-q" placeholder="搜索备注 / 名称 / IP / MAC"><button class="btn" id="dv-add">登记设备</button></div>
    <div id="dv-edit"></div>
    <div class="card"><div class="tbl-wrap"><table class="t"><thead><tr><th>设备</th><th class="hm">默认名</th><th class="hm">状态</th><th class="hm">首次见到</th><th class="r">操作</th></tr></thead><tbody id="dv-b"></tbody></table></div>
    <div class="note">名册由 apwatch 自己维护：连过这台 AP 的设备都会记下，不随终端页的 24 小时窗口消失。备注只存在 apwatch 里（aliases.json），不写到 AP 上；没写备注时显示设备通过 DHCP 广播的主机名。改备注、禁用和解禁要先登录；不在线的设备也能禁用。</div></div>`;
  $("#dv-q").oninput = e => { q = e.target.value.trim().toLowerCase(); draw(); };
  $("#dv-add").onclick = () => aliasEditor($("#dv-edit"), { mac: "" }, () => refresh(true));
  function status(d) {
    if (blocked.has(d.mac)) return '<span class="pill bad">已禁用</span>';
    if (d.online) return `<span class="pill ok"><span class="dot ok"></span>在线</span> <span class="band-tag">${bandName(d.band)}</span>`;
    return d.last_seen ? `<span class="muted">${fmtAgo(d.last_seen)}离线</span>` : '<span class="muted">还没连过</span>';
  }
  function draw() {
    if (!data) return;
    let list = data.devices;
    if (q) list = list.filter(d => [d.name, d.hostname, d.ip, d.mac].some(x => (x || "").toLowerCase().includes(q)));
    const on = data.devices.filter(d => d.online).length;
    $("#dv-sum").textContent = `共 ${data.devices.length} 台，在线 ${on}，有备注 ${data.devices.filter(d => d.alias).length}${logged ? `，已禁用 ${blocked.size}` : ""}`;
    $("#dv-b").innerHTML = list.length ? list.map(d => `<tr class="${d.online ? "" : "off"}" data-mac="${esc(d.mac)}">
        <td class="dev"><b><a href="#/client/${esc(d.mac)}">${esc(d.name || d.ip || "未知设备")}</a>${d.alias ? ' <span class="tag">备注</span>' : ""}</b><span>${esc(d.mac)}${d.ip && d.name ? " · " + esc(d.ip) : ""}${d.random_mac ? " · 随机 MAC" : ""}</span><div class="sm">${status(d)}</div></td>
        <td class="hm">${esc(d.hostname || "—")}</td>
        <td class="hm">${status(d)}</td>
        <td class="hm muted">${d.first_seen ? fmtFull(d.first_seen).replace(/:\d\d$/, "") : "—"}</td>
        <td class="r" style="white-space:nowrap"><button class="link-btn ed">备注</button> ${blocked.has(d.mac) ? '<button class="btn ub">解禁</button>' : '<button class="btn bk">禁用…</button>'}</td></tr>`).join("")
      : '<tr><td colspan="5" class="empty">没有符合条件的设备</td></tr>';
  }
  $("#dv-b").onclick = async e => {
    const tr = e.target.closest("tr[data-mac]"); if (!tr) return;
    const d = data.devices.find(x => x.mac === tr.dataset.mac), box = $("#dv-edit");
    if (e.target.closest(".ed")) aliasEditor(box, d, () => refresh(true));
    else if (e.target.closest(".bk")) { blockConfirm(box, d, () => setTimeout(() => refresh(true), 1200)); scrollTo(0, 0); }
    else if (e.target.closest(".ub")) {
      box.innerHTML = '<div class="msg">执行中…（登录官方接口并读回确认，约几秒）</div>';
      try { await apiPost("/api/ctl/block", { mac: d.mac, block: false }); box.innerHTML = `<div class="msg ok">已解禁 ${esc(d.name || d.mac)}</div>`; }
      catch (err) { box.innerHTML = `<div class="msg bad">失败：${esc(err.message)}</div>`; }
      setTimeout(() => refresh(true), 800);
    }
  };
  return {
    title: "设备",
    async refresh() {
      const [d, sess, o] = await Promise.all([api("/api/devices"), api("/api/session"), api("/api/collector")]);
      setConn(o); data = d; logged = sess.logged_in;
      if (logged) { try { blocked = new Set((await api("/api/ctl")).blocked.map(x => x.mac)); } catch { blocked = new Set(); } }
      draw();
    },
  };
};

    },

VIEWS.events = root => {
  let kinds = new Set((store.get("evk", "") || "").split(",").filter(Boolean)), mac = "", data = null;
  root.innerHTML = `<div class="panel-title"><h2>事件</h2><span class="sub" id="ev-sum"></span><div style="flex:1"></div><input class="search" id="ev-q" placeholder="按设备名 / MAC 过滤"></div>
    <div class="card" style="margin-bottom:16px"><div class="chips" id="ev-k"></div></div>
    <div class="card" id="ev-radar" style="margin-bottom:16px;display:none"></div>
    <div class="card"><div id="ev-list"></div></div>`;
  $("#ev-q").oninput = e => { mac = e.target.value.trim().toLowerCase(); draw(); };
  $("#ev-k").onclick = e => {
    const k = e.target.closest(".chip")?.dataset.k; if (k == null) return;
    if (k === "") kinds.clear(); else if (kinds.has(k)) kinds.delete(k); else kinds.add(k);
    store.set("evk", [...kinds].join(",")); draw();
  };
  function draw() {
    if (!data) return;
    const order = ["online", "offline", "assoc", "roam", "control", "radar", "dfs", "precac", "width", "chan", "radio_restart", "ap_reboot", "thermal", "collector", "gap"];
    $("#ev-k").innerHTML = `<button class="chip ${kinds.size ? "" : "on"}" data-k="">全部<span class="n">${data.total}</span></button>` +
      order.filter(k => data.counts[k]).map(k => `<button class="chip ${kinds.has(k) ? "on" : ""}" data-k="${k}">${EV[k]?.[0] || k}<span class="n">${data.counts[k]}</span></button>`).join("");
    let list = data.events.filter(e => !kinds.size || kinds.has(e.kind));
    if (mac) list = list.filter(e => (e.mac || "").includes(mac) || (e.name || "").toLowerCase().includes(mac));
    $("#ev-sum").textContent = `${({ "1h": "1 小时", "6h": "6 小时", "24h": "24 小时", "7d": "7 天", "30d": "30 天" })[range]}内 ${list.length} 条${list.length >= 3000 ? "（只显示最近 3000 条）" : ""}`;
    let html = "", day = "";
    for (const e of list.slice(0, 3000)) {
      const d = new Date(e.t * 1000), dk = `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
      if (dk !== day) { day = dk; html += `<div class="day-h">${d.getMonth() + 1}月${d.getDate()}日 星期${"日一二三四五六"[d.getDay()]}</div>`; }
      html += evRow(e, false);
    }
    $("#ev-list").innerHTML = html || `<div class="empty">没有符合条件的事件</div>`;
  }
  return {
    title: "事件",
    async refresh() {
      const [d, o, ov] = await Promise.all([api(`/api/events?range=${range}&limit=3000`), api("/api/collector"), api("/api/overview")]);
      setConn(o); data = d; draw();
      const box = $("#ev-radar");

        box.style.display = "";
        box.innerHTML = `<div class="card-h"><h3>5G 雷达避让</h3><span class="sub">近 7 天。160MHz 必然覆盖 DFS 频段，检测到雷达时 AP 会断开 5G 终端、临时降到非 DFS 信道，后台检测通过后再回来</span></div>` +
          ov.radar.map(r => `<div class="ev"><time>${fmtClock(r.t, true)}</time><span class="ek bad">${svgIcon("radar")}</span><div>${esc(r.msg)}；${r.end ? `约 ${fmtDur(r.end - r.t)} 后恢复（${fmtClock(r.end, true)}）` : "未见恢复记录"}</div></div>`).join("");
      } else box.style.display = "none";
    },
  };
};

      <button class="btn ${on ? "" : "pri"} tg" data-b="${b}">${on ? "关闭" : "打开"} ${bandName(b)}</button></div><div class="cf"></div></div>`;
  }
  function draw() {
    const body = $("#mg-body");
    const blockedMacs = new Set(data.blocked.map(x => x.mac));
    // 在线的排前面；同组里有名字的排前面，再按名字排
    const byName = (a, b) => (!a.name - !b.name) || (a.name || a.ip || a.mac).localeCompare(b.name || b.ip || b.mac, "zh");
    const cand = devices.filter(d => !blockedMacs.has(d.mac));
    const opt = d => `<option value="${esc(d.mac)}">${esc(d.name || d.ip || d.mac)}${d.online ? " · " + bandName(d.band) : d.last_seen ? " · " + fmtAgo(d.last_seen) + "离线" : ""}${d.ip && d.name ? " · " + esc(d.ip) : ""}</option>`;
    const grp = (label, l) => l.length ? `<optgroup label="${label}">${l.sort(byName).map(opt).join("")}</optgroup>` : "";
    body.innerHTML = `<div class="grid g2" id="mg-radio">${radioCard(0)}${radioCard(1)}</div>
      <div class="grid g2">
        <div class="card"><div class="card-h"><h3>已禁用的设备</h3><span class="sub">${data.blocked.length} 台</span></div><div id="mg-blocked">${data.blocked.length ? data.blocked.map(d => `<div class="list-row"><div class="grow dev"><b>${esc(d.name || d.ip || d.mac)}</b><span>${esc(d.mac)}${d.ip ? " · " + esc(d.ip) : ""}${d.random_mac ? " · 随机 MAC" : ""}</span></div><button class="btn ub" data-mac="${esc(d.mac)}">解禁</button></div>`).join("") : '<div class="empty">没有被禁用的设备</div>'}</div><div class="msg" id="mg-bmsg"></div></div>
        <div class="card"><div class="card-h"><h3>禁用一台设备</h3><span class="sub">名册里的设备都能选，不在线的也可以</span></div>
          <div class="btn-row"><select class="inp" id="mg-dev" style="flex:1;min-width:180px"><option value="">选择设备…</option>${grp("在线", cand.filter(d => d.online))}${grp("不在线", cand.filter(d => !d.online))}</select></div>
          <div class="btn-row"><input class="inp" id="mg-mac" placeholder="或直接填 MAC：aa:bb:cc:dd:ee:ff" style="flex:1;min-width:180px"><button class="btn" id="mg-bgo">禁用…</button></div><div id="mg-bcf"></div></div>
      </div>
      <div class="grid g2">
        <div class="card"><div class="card-h"><h3>自动恢复计划</h3><span class="sub">到点自动执行；程序重启后照样执行</span></div><div>${data.plans.length ? data.plans.map(p => `<div class="list-row"><div class="grow"><b>${esc(p.desc)}</b><div class="muted" style="font-size:12.5px">${fmtFull(p.at)}（${p.at > Date.now() / 1000 ? fmtDur(p.at - Date.now() / 1000) + "后" : "即将执行"}）</div></div><button class="btn cx" data-id="${p.id}">取消</button></div>`).join("") : '<div class="empty">没有待执行的计划</div>'}</div></div>
        <div class="card"><div class="card-h"><h3>说明</h3></div><ul class="muted" style="margin:0;padding-left:18px;font-size:13px;line-height:1.8">
          <li>禁用是官方的 WiFi 黑名单：设备连不上 WiFi，局域网也用不了；插网线的设备不受影响。</li>
          <li>随机 MAC 的设备换地址后可能重新连上，要彻底禁用得在设备上关掉“私有地址”。</li>
          <li>两个频段名称不同，关掉一个频段时设备不会自动转到另一个频段。</li>
          <li>2026-10-27 实测：关 5G 约 35 秒，重开 6 秒内开始回连；关 2.4G 后 15 台约 140 秒全部回来；禁用 6 秒内踢下线，解禁 6 秒内重连。</li></ul></div>
      </div>`;
    body.querySelectorAll(".tg").forEach(btn => btn.onclick = () => {
      const b = +btn.dataset.b, on = data.radio[b], cf = btn.closest(".card").querySelector(".cf");
      if (!on) { act("/api/ctl/radio", { band: b, enable: true }, cf); return; }
      cf.innerHTML = `<div class="confirm"><p><b>关闭 ${bandName(b)}</b>：${ov.online[b]} 台设备会断开；它们不会自动转到另一个频段。如果你正通过 ${bandName(b)} 打开本页，页面也会断开，建议选自动恢复。</p>
        <div class="btn-row">${restoreSelect(30)}<button class="btn danger go">确认关闭</button><button class="btn no">取消</button></div><div class="msg"></div></div>`;
      cf.querySelector(".no").onclick = () => { cf.innerHTML = ""; };
      cf.querySelector(".go").onclick = () => act("/api/ctl/radio", { band: b, enable: false, restore_mins: +cf.querySelector(".rs").value }, cf);
    });
    body.querySelectorAll(".ub").forEach(btn => btn.onclick = () => act("/api/ctl/block", { mac: btn.dataset.mac, block: false }, $("#mg-bmsg")));
    body.querySelectorAll(".cx").forEach(btn => btn.onclick = async () => { try { await apiPost("/api/ctl/cancel", { id: +btn.dataset.id }); } catch (e) { alertMsg(e); } refresh(true); });
    const go = $("#mg-bgo");
    $("#mg-mac").oninput = () => { if ($("#mg-mac").value.trim()) $("#mg-dev").value = ""; };
    $("#mg-dev").onchange = () => { $("#mg-mac").value = ""; };
    if (go) go.onclick = () => {
      const typed = $("#mg-mac").value.trim(), box = $("#mg-bcf");
      let d = cand.find(x => x.mac === $("#mg-dev").value);
      if (typed) {
        const m = normMac(typed);
        if (!m) { box.innerHTML = '<div class="msg bad">MAC 格式不对</div>'; return; }
        if (blockedMacs.has(m)) { box.innerHTML = '<div class="msg bad">这台设备已经在禁用名单里</div>'; return; }
        d = devices.find(x => x.mac === m) || { mac: m, online: false, random_mac: (parseInt(m.slice(0, 2), 16) & 2) !== 0 };
      }
      if (!d) { box.innerHTML = '<div class="msg bad">先选设备或填 MAC</div>'; return; }
      blockConfirm(box, d, () => setTimeout(() => refresh(true), 1200));
    };
  }
  function alertMsg(e) { const m = $("#mg-bmsg"); if (m) { m.className = "msg bad"; m.textContent = e.message; } }
  async function act(path, body, box) {
    box.querySelectorAll?.("button").forEach(b => b.disabled = true);
    const show = (cls, t) => { if (box.classList?.contains("msg")) { box.className = "msg " + cls; box.textContent = t; } else box.innerHTML = `<div class="msg ${cls}">${esc(t)}</div>`; };
    show("", "执行中…（登录官方接口并读回确认，约几秒）");
    try { data = await apiPost(path, body); show("ok", "已完成"); setTimeout(() => refresh(true), 800); }
    catch (e) { show("bad", "失败：" + e.message); }
  }
  return {
    title: "管理",
    async refresh() {
      const [sess, dv, o, co] = await Promise.all([api("/api/session"), api("/api/devices"), api("/api/overview"), api("/api/collector")]);
      setConn(co); devices = dv.devices; ov = o;
      $("#mg-out").style.display = sess.logged_in ? "" : "none";
      if (!sess.logged_in) {
        $("#mg-body").innerHTML = `<div class="card"><div class="empty" style="padding:40px 0">管理功能需要先用 AP 管理员密码登录<div style="margin-top:14px"><button class="btn pri" id="mg-login">登录</button></div></div></div>`;
        $("#mg-login").onclick = async () => { if (await loginDialog()) refresh(true); };
        return;
      }
      try { data = await apiAuthGet("/api/ctl"); draw(); }
      catch (e) { $("#mg-body").innerHTML = `<div class="card"><div class="empty">读取官方状态失败：${esc(e.message)}</div></div>`; }
    },
  };
};

VIEWS.settings = root => {
  root.innerHTML = `<div class="card" style="margin-bottom:16px" id="set-card"><div class="card-h"><h3>设置</h3><span class="sub">保存后立即生效；改连接或采集间隔会让采集按新设置重新连接</span></div><form id="set-form"></form></div>
    <div class="grid g3" id="co-top"></div>
    <div class="grid g2" id="co-ch"></div>
    <div class="card" style="margin-bottom:16px"><div class="card-h"><h3>采集命令</h3><span class="sub">全部经同一个 telnet 会话串行执行，任意时刻 AP 上最多一条</span></div><div class="tbl-wrap"><table class="t"><thead><tr><th>命令</th><th>周期</th><th class="r">次数</th><th class="r">最近耗时</th><th class="r">平均耗时</th><th class="r">回传字节</th><th class="r">失败</th><th class="r">最近</th></tr></thead><tbody id="co-cmds"></tbody></table></div></div>
    <div class="card"><div class="card-h"><h3>采集的只读保证与开销</h3></div>
      <p class="muted" style="margin-top:0">采集只通过 telnet 发送下面这份固定命令（“管理”页的控制操作另走官方 Web 接口）；唯一带参数的是终端详情页的 <code>apstats -s -m &lt;MAC&gt;</code>，MAC 先经严格格式校验。不会发送 <code>dmesg -c</code>、<code>iwpriv … set</code>、<code>cfg80211tool … s*</code>、<code>reboot</code> 等会改变状态的命令，AP 上也不落任何文件。</p>
      <div id="co-wl" style="display:flex;flex-wrap:wrap;gap:6px"></div>
      <p class="muted">2026-10-26 实测（同一会话比较 <code>/proc/stat</code> 增量，每项 10 次）：每条命令在 AP 上的 CPU 开销都不超过约 0.1 秒，最贵的是全量 <code>dmesg</code>（只在连上时拉一次）；AP 自身空闲基线约占两核的 5%。按 30 秒一轮估算，采集约占 AP 总 CPU 能力的 0.3%。上方 AP CPU 曲线已包含采集本身，可直接对照。</p>
    </div>`;
  const cCpu = chartCard($("#co-ch"), "AP CPU", "两核合计的忙碌比例，含采集本身");
  let setLoaded = false;
  async function loadSettings() {
    const s = await api("/api/settings");
    const b = s.bounds;
    const num = (k, label, unit, hint) => `<div class="field"><label>${label}（${unit}）</label><input class="inp" name="${k}" type="number" min="${b[k][0]}" max="${b[k][1]}" value="${s[k]}"><span class="hint">${hint} · 范围 ${b[k][0]}～${b[k][1]}</span></div>`;
    $("#set-form").innerHTML = `<div class="form-grid">
      <div class="form-sec">连接 AP</div>
      <div class="field"><label>AP 地址</label><input class="inp" name="ap_host" value="${esc(s.ap_host)}"><span class="hint">改地址时必须同时重新输入密码和解锁串</span></div>
      <div class="field"><label>管理员密码</label><input class="inp" name="password" type="password" autocomplete="new-password" placeholder="${s.password_set ? "已设置，留空不改" : "未设置"}"><span class="hint">telnet 登录与官方页面共用；只写不读</span></div>
      <div class="field"><label>goash 解锁串</label><input class="inp" name="unlock" type="password" autocomplete="off" placeholder="${s.unlock_set ? "已设置，留空不改" : "未设置"}"><span class="hint">只写不读</span></div>
      <div class="form-sec">采集间隔</div>
      ${num("fast_secs", "快速轮询", "秒", "终端、信道、射频计数")}
      ${num("dmesg_secs", "内核日志", "秒", "连接 / 雷达等事件")}
      ${num("slow_secs", "慢速统计", "秒", "重传、温度、设备名")}
      <div class="form-sec">数据与设备名</div>
      ${num("save_mins", "保存间隔", "分钟", "内存数据追加写盘")}
      <div class="field"><label>DHCP 租约文件</label><input class="inp" name="leases_path" value="${esc(s.leases_path)}" placeholder="留空不用"><span class="hint">设备广播的主机名从这里读；主路由上是 /tmp/dhcp.leases</span></div>
      </div>
      <div class="btn-row"><button class="btn pri">保存</button><span class="muted" id="set-est"></span></div><div class="msg" id="set-msg"></div>`;
    const est = () => { const f = +$("#set-form").fast_secs.value || s.fast_secs; $("#set-est").textContent = `按 2026-10-26 实测估算，采集约占 AP CPU ${(0.24 * 30 / f).toFixed(2)}%`; };
    $("#set-form").fast_secs.oninput = est; est();
    $("#set-form").onsubmit = async e => {
      e.preventDefault();
      const f = e.target, body = {};
      for (const k of ["ap_host", "leases_path"]) body[k] = f[k].value.trim();
      for (const k of ["fast_secs", "dmesg_secs", "slow_secs", "save_mins"]) body[k] = +f[k].value;
      for (const k of ["password", "unlock"]) if (f[k].value) body[k] = f[k].value;
      const m = $("#set-msg");
      try {
        const r = await apiPost("/api/settings", body);
        m.className = "msg ok"; m.textContent = r.reconnect ? "已保存，采集正在按新设置重新连接" : "已保存";
        f.password.value = ""; f.unlock.value = "";
      } catch (err) { m.className = "msg bad"; m.textContent = "保存失败：" + err.message; }
    };
    setLoaded = true;
  }
  const cMem = chartCard($("#co-ch"), "AP 内存", "占用比例（不含可回收缓存）");
  return {
    title: "设置",
    async refresh() {
      if (!setLoaded) await loadSettings();
      const [c, ap, sv] = await Promise.all([api("/api/collector"), api(`/api/series?key=ap&range=${range}`), api("/api/settings")]);
      const lbl = x => x % 60 === 0 ? `${x / 60} 分钟` : `${x} 秒`;
      setConn(c);
      $("#co-top").innerHTML = `
        <div class="card"><div class="card-h"><h3>连接</h3><div class="act">${c.paused_since ? '<button class="btn pri" id="co-resume">恢复采集</button>' : '<button class="btn" id="co-pause">暂停采集</button>'}</div></div><div class="row" style="margin-bottom:8px">${connPill(c)}${c.paused_since ? `<span class="muted">${fmtFull(c.paused_since)} 起</span>` : ""}</div><div id="co-pcf"></div>
          <dl class="kv"><dt>本次连接于</dt><dd class="num">${c.connected_since ? fmtClock(c.connected_since, true) : "—"}</dd><dt>最近采样</dt><dd class="num">${c.last_poll ? fmtAgo(c.last_poll) : "—"}</dd><dt>累计连接</dt><dd class="num">${c.connects} 次</dd><dt>程序启动</dt><dd class="num">${fmtClock(c.started, true)}</dd></dl>
          ${c.last_error ? `<div class="note" style="color:var(--bad-ink)">最近错误（${c.last_error_t ? fmtClock(c.last_error_t, true) : ""}）：${esc(c.last_error)}</div>` : ""}</div>
        <div class="card"><div class="card-h"><h3>节奏</h3></div><dl class="kv"><dt>系统、信道、终端、射频计数</dt><dd>${lbl(sv.fast_secs)}</dd><dt>内核日志末 40 行</dt><dd>${lbl(sv.dmesg_secs)}</dd><dt>VAP 统计、温度、SSID、设备名</dt><dd>${lbl(sv.slow_secs)}</dd><dt>单终端 MCS</dt><dd>按需</dd><dt>设备 IP</dt><dd>DHCP 租约，静态 IP 取本机 ARP 表</dd></dl></div>
        <div class="card"><div class="card-h"><h3>存储</h3></div><dl class="kv"><dt>序列</dt><dd class="num">${c.store.series}</dd><dt>数据点（内存）</dt><dd class="num">${c.store.samples.toLocaleString()}</dd><dt>事件</dt><dd class="num">${c.store.events.toLocaleString()}</dd><dt>保留</dt><dd>原始 6 小时 · 2 分钟 24 小时 · 15 分钟 7 天 · 1 小时 30 天</dd><dt>写盘</dt><dd>每 ${sv.save_mins} 分钟追加（压缩）</dd></dl></div>`;
      const pcf = $("#co-pcf"), setPause = async paused => {
        pcf.innerHTML = '<div class="msg">执行中…</div>';
        try { await apiPost("/api/collector/pause", { paused }); pcf.innerHTML = ""; setTimeout(() => refresh(true), paused ? 300 : 3000); }
        catch (e) { pcf.innerHTML = `<div class="msg bad">失败：${esc(e.message)}</div>`; }
      };
      if ($("#co-resume")) $("#co-resume").onclick = () => setPause(false);
      if ($("#co-pause")) $("#co-pause").onclick = () => {
        pcf.innerHTML = `<div class="confirm"><p><b>暂停采集</b>：断开到 AP 的连接，AP 上不再执行任何采集命令。历史数据照常可看，管理功能照常可用；暂停这段在图表上是空白。程序或路由重启后仍保持暂停，要回这里手动恢复。</p>
          <div class="btn-row"><button class="btn danger go">确认暂停</button><button class="btn no">取消</button></div></div>`;
        pcf.querySelector(".no").onclick = () => { pcf.innerHTML = ""; };
        pcf.querySelector(".go").onclick = () => setPause(true);
      };
      const rows = Object.entries(c.cmds).sort((a, b) => a[0].localeCompare(b[0]));
      $("#co-cmds").innerHTML = rows.map(([k, s]) => `<tr><td><code>${esc(s.cmd)}</code></td><td>${esc(s.every)}</td><td class="r num">${s.count}</td><td class="r num">${fmtNum(s.last_ms)} ms</td><td class="r num">${fmtNum(s.avg_ms)} ms</td><td class="r num">${s.last_bytes.toLocaleString()}</td><td class="r num">${s.errors}</td><td class="r num">${s.last_t ? fmtAgo(s.last_t) : "—"}</td></tr>`).join("") || `<tr><td colspan="8" class="empty">还没有执行过命令</td></tr>`;
      $("#co-wl").innerHTML = c.whitelist.map(x => `<code>${esc(x)}</code>`).join("");
      const base = { from: ap.from, to: ap.to };
      cCpu.set({ ...base, t: ap.data.t, series: [{ name: "CPU", color: "--s1", values: ap.data.v.cpu }], yMin: 0, unit: "%", tipFmt: v => v.toFixed(1) + "%", height: 200, area: true });
      cMem.set({ ...base, t: ap.data.t, series: [{ name: "内存", color: "--s1", values: ap.data.v.mem_pct }], yMin: 0, yMax: 100, unit: "%", height: 200, area: true });
    },
  };
};

applyTheme();
route();
</script>
</body>
